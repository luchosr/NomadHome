name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "apps/**"
      - "packages/**"
      - "eslint.config.js"
      - "tsconfig.base.json"

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-network: true
          python-version: "3.10"

      - name: Install Google Generative AI SDK
        run: pip install google-generativeai

      - name: Generate Code Review with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

          python -c '
          import os
          import google.generativeai as genai

          with open("pr_diff.txt", "r") as f:
              diff = f.read()

          prompt = """Act as a Principal Software Engineer and expert in Domain-Driven Design (DDD).
          Analyze the changes in this Pull Request within the NomadHome monorepo and provide a critical review.

          Pay special attention to:
          1. **DDD Architecture (apps/api)**: Ensure that layers (Presentation, Application, Domain, Infrastructure) respect their boundaries. The Domain layer MUST have zero external dependencies.
          2. **Immutability and Types**: Verify that monetary calculations use integer types in cents (Money value objects) and never floating-point numbers.
          3. **Frontend (apps/web)**: Check for strict separation of state (TanStack Query for server state, URL params for filters/search, and Zustand exclusively for ephemeral UI).
          4. **Database Invariants**: If there are changes to Prisma or migrations, validate that critical constraints are not broken (such as the exclusion constraint for overlapping dates in AvailabilityBlock or the immutability of fee snapshots).

          Write your response in English. Be concise, direct, and polite. Structure your comments into:
          - 🚨 **Bugs or Critical Errors** (If any)
          - 📐 **Architecture and Code Standards**
          - 💡 **Optimization Suggestions**

          Here is the git diff:
          """ + diff

          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          model = genai.GenerativeModel("gemini-1.5-flash")
          response = model.generate_content(prompt)

          with open("review_result.txt", "w") as f:
              f.write("### Gemini AI Code Review\n\n" + response.text)
          '

      - name: Post Comment to PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-file: review_result.txt
