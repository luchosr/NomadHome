name: Deploy Notification / Trigger

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"

jobs:
  redeploy-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Redeploy
        run: |
          curl -X POST "https://api.vercel.com/v1/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"nomadhome\", \"project\": \"${{ secrets.VERCEL_PROJECT_ID }}\", \"deploymentDataSource\": \"github\"}"
