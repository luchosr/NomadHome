name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 satisfies both the project's >= 20.19 engine floor and pnpm
      # 11.1.2's own >= 22.13 requirement. Corepack (bundled with Node) provides
      # pnpm from the `packageManager` field, running it on this Node — unlike
      # pnpm/action-setup, whose self-installer uses the runner's default Node.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate OpenSpec changes and specs
        run: pnpm dlx @fission-ai/openspec@1.3.1 validate --all --strict

      - name: MVP scope guard
        run: node scripts/check-mvp-scope.mjs
