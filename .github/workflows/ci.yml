name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nomadhome
          POSTGRES_PASSWORD: nomadhome
          POSTGRES_DB: nomadhome
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nomadhome"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nomadhome:nomadhome@localhost:5432/nomadhome?schema=public
      JWT_SECRET: ci-test-secret-must-be-at-least-32-chars
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history (not just the PR merge ref) so diff-cover can diff
          # against origin/main below.
          fetch-depth: 0

      # Node 20.20.0: above the project's >= 20.19 floor (project.md §4) and the
      # lowest 20.x the OpenSpec CLI's deps accept (posthog-node needs ^20.20.0).
      # Corepack provides pnpm from the `packageManager` field; pnpm 9 builds
      # dependency scripts without an approval gate.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Generate the client and apply migrations against the service DB before
      # tests. `migrate deploy` is a no-op until capability tickets add migrations.
      - name: Prepare database
        run: |
          pnpm --filter @nomadhome/db exec prisma generate
          pnpm --filter @nomadhome/db exec prisma migrate deploy

      - name: Test with coverage
        run: pnpm coverage

      # diff-cover checks coverage of only the lines changed in this PR (not
      # whole-repo coverage) against the merged lcov reports below.
      - name: Setup Python for diff-cover
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install diff-cover
        if: github.event_name == 'pull_request'
        run: pip install diff-cover==10.*

      - name: Merge coverage reports
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p coverage
          rm -f coverage/lcov.info
          for pkg in apps/api apps/web packages/ui packages/shared packages/db; do
            if [ -f "$pkg/coverage/lcov.info" ]; then
              sed "s|^SF:|SF:$pkg/|" "$pkg/coverage/lcov.info" >> coverage/lcov.info
            fi
          done

      - name: Diff coverage gate (≥80% on changed lines)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          diff-cover coverage/lcov.info --compare-branch=origin/main --fail-under=80

      - name: Build
        run: pnpm build

      - name: Validate OpenSpec changes and specs
        run: pnpm dlx @fission-ai/openspec@1.3.1 validate --all --strict

      - name: MVP scope guard
        run: node scripts/check-mvp-scope.mjs

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @nomadhome/shared build
          pnpm --filter @nomadhome/ui build

      - name: Install Playwright browsers
        run: pnpm --filter @nomadhome/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
