name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20.20.0: above the project's >= 20.19 floor (project.md §4) and the
      # lowest 20.x the OpenSpec CLI's deps accept (posthog-node needs ^20.20.0).
      # Corepack provides pnpm from the `packageManager` field; pnpm 9 builds
      # dependency scripts without an approval gate.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate OpenSpec changes and specs
        run: pnpm dlx @fission-ai/openspec@1.3.1 validate --all --strict

      - name: MVP scope guard
        run: node scripts/check-mvp-scope.mjs
